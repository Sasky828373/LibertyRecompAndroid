name: Build GTA IV Android ARM64 APK
on:
  workflow_dispatch:
  push:
    branches: [android-arm64-apk-ci]

jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'
      - name: Pin NDK r29 for native build
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/ndk/29.0.14206865" || { echo "NDK r29 missing"; exit 1; }
      - name: Cache native build and host tools
        uses: actions/cache@v4
        with:
          path: |
            out/build/android-arm64
            out/build/android-driver-proxy
            out/host-tools
            glue/rexglue-sdk-main/out/linux-arm64
          key: gta4-android-native-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'os/android/native/CMakeLists.txt', 'os/android/scripts/*.sh') }}
          restore-keys: |
            gta4-android-native-${{ runner.os }}-
      - name: Prepare repo and native dependencies
        run: |
          python tools/setup_repo.py
          bash os/android/scripts/build_driver_proxy.sh
      - name: Compile native ARM64 Vulkan renderer
        run: STRIP=1 bash os/android/scripts/build_native.sh 4
      - name: Package APK
        run: |
          rm -f os/android/app/build/outputs/apk/debug/app-debug.apk
          bash os/android/scripts/build_apk.sh
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-IV-LibertyRecomp-Android-arm64
          path: os/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
