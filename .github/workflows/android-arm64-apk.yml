name: Android ARM64 APK

on:
  push:
    branches:
      - perf/android-120fps-frametime-baseline
  pull_request:
    paths:
      - '.github/workflows/android-arm64-apk.yml'
      - 'os/android/**'
      - 'glue/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        shell: pwsh
        run: |
          $sdk = "C:\Android\android-sdk"
          $sdkmanager = Get-ChildItem "$sdk\cmdline-tools" -Recurse -Filter sdkmanager.bat |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkmanager) { throw "sdkmanager.bat not found in $sdk" }
          & $sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export Git Bash SDK and JDK paths
        run: |
          echo "ANDROID_HOME=$(cygpath -u 'C:\Android\android-sdk')" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$(cygpath -u 'C:\Android\android-sdk\ndk\29.0.14206865')" >> "$GITHUB_ENV"
          echo "NDK_VER=29.0.14206865" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$(cygpath -u "$JAVA_HOME")" >> "$GITHUB_ENV"
      - name: Install compiler cache
        shell: pwsh
        run: |
          choco install ccache --version=4.13.6 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'C:\ProgramData\chocolatey\bin\ccache.exe')) {
            throw 'ccache.exe not found after installation'
          }
      - name: Configure compiler cache
        run: |
          echo "CCACHE_LAUNCHER=$(cygpath -m 'C:\ProgramData\chocolatey\bin\ccache.exe')" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$(pwd)/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$(pwd)" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
      - name: Restore compiled object cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ndk29-arm64-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ndk29-arm64-ccache-
      - name: Setup repository
        run: python tools/setup_repo.py
      - name: Build Vulkan driver
        run: bash os/android/scripts/build_driver_proxy.sh
      - name: Build native ARM64 libraries
        run: STRIP=1 bash os/android/scripts/build_native.sh 3
      - name: Assemble Android debug APK
        run: bash os/android/scripts/build_apk.sh debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibertyRecompAndroid-arm64-debug
          path: os/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: |
          if [ -n "${CCACHE_LAUNCHER:-}" ]; then
            "${CCACHE_LAUNCHER}" --show-stats || true
          fi
      - name: Preserve compiled object cache even after failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ndk29-arm64-ccache-${{ github.run_id }}-${{ github.run_attempt }}
