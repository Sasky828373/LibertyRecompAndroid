name: Android ARM64 performance APK
on:
  push:
    branches:
      - perf/120fps-efficiency-bundle-20261010
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install Python dependencies and fetch pinned sources
        run: |
          python --version
          python tools/setup_repo.py
      - name: Set up NDK environment
        run: |
          echo "ANDROID_HOME=$(cygpath -u "$ANDROID_HOME")" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$(cygpath -u "$JAVA_HOME")" >> "$GITHUB_ENV"
          echo "NDK_VER=29.0.14206865" >> "$GITHUB_ENV"
      - name: Install Android NDK r29
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" --install "ndk;29.0.14206865"
      - name: Build Vulkan driver proxy
        run: bash os/android/scripts/build_driver_proxy.sh
      - name: Build native game and renderer
        run: STRIP=1 bash os/android/scripts/build_native.sh 4
      - name: Build Android APK
        run: bash os/android/scripts/build_apk.sh
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liberty-recomp-android-perf-apk
          path: os/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
